services:
  # Backend FastAPI service. Deployed from the backend/ directory.
  - type: web
    name: contextsync-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: JIRA_DOMAIN
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: CONFLUENCE_URL
        sync: false
      - key: CONFLUENCE_USERNAME
        sync: false
      - key: CONFLUENCE_API_TOKEN
        sync: false
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_SEARCH_QUERY
        sync: false
